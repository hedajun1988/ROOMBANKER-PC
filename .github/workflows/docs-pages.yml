name: Publish manual
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm repo:check
      - run: pnpm docs:check
      - run: pnpm docs:build
        env: { DOCS_BASE: /ROOMBANKER-PC/ }
      - run: pnpm docs:smoke
        env: { MANUAL_DOCS_BUILT: '1' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/manual/.vitepress/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
